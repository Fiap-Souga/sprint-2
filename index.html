<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>iPhone Camera Pro</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
/>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

body{
    width:100%;
    height:100vh;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

/* PHONE */

.phone{
    width:390px;
    height:820px;
    background:#000;
    border-radius:55px;
    overflow:hidden;
    position:relative;

    border:8px solid #161616;

    box-shadow:
    0 0 0 2px #444,
    0 0 40px rgba(255,255,255,0.08),
    inset 0 0 10px rgba(255,255,255,0.05);
}

/* NOTCH */

.notch{
    position:absolute;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    width:170px;
    height:35px;
    background:black;
    border-radius:30px;
    z-index:1000;
}

/* STATUS */

.status-bar{
    width:100%;
    padding:18px 24px;
    position:absolute;
    top:0;
    left:0;

    display:flex;
    justify-content:space-between;
    align-items:center;

    color:white;
    z-index:999;

    font-size:18px;
    font-weight:600;
}

.status-icons{
    display:flex;
    gap:10px;
}

/* TOP MENU */

.top-menu{
    width:100%;
    position:absolute;
    top:70px;
    left:0;

    display:flex;
    justify-content:space-around;
    align-items:center;

    padding:16px 0;

    color:white;

    z-index:999;

    background:rgba(0,0,0,0.22);

    backdrop-filter:blur(15px);

    border-top:1px solid rgba(255,255,255,0.08);
    border-bottom:1px solid rgba(255,255,255,0.08);

    font-size:26px;
}

.top-menu i{
    cursor:pointer;
    transition:.2s;
}

.top-menu i:hover{
    transform:scale(1.1);
}

/* CAMERA AREA */

.camera-area{
    width:100%;
    height:100%;
    position:relative;
    overflow:hidden;
}

/* VIDEO */

video{
    width:100%;
    height:100%;
    object-fit:cover;
    background:black;

    /* REMOVE ESPELHO */
    transform:scaleX(1);
}

/* FLASH */

.flash{
    position:absolute;
    inset:0;
    background:white;
    opacity:0;
    pointer-events:none;
    transition:.15s;
}

/* GRID */

.grid{
    position:absolute;
    inset:0;
    pointer-events:none;
    display:none;
}

.grid span{
    position:absolute;
    background:rgba(255,255,255,0.18);
}

.grid span:nth-child(1),
.grid span:nth-child(2){
    width:1px;
    height:100%;
}

.grid span:nth-child(3),
.grid span:nth-child(4){
    height:1px;
    width:100%;
}

.grid span:nth-child(1){ left:33.3%; }
.grid span:nth-child(2){ left:66.6%; }

.grid span:nth-child(3){ top:33.3%; }
.grid span:nth-child(4){ top:66.6%; }

/* FOCUS */

.focus{
    width:90px;
    height:90px;

    border:3px solid #ffd000;

    border-radius:12px;

    position:absolute;

    display:none;

    pointer-events:none;

    animation:focusAnim .7s ease;
}

@keyframes focusAnim{

    0%{
        transform:scale(1.4);
        opacity:0;
    }

    50%{
        opacity:1;
    }

    100%{
        transform:scale(1);
        opacity:0;
    }

}

/* ZOOM */

.zoom{
    position:absolute;
    bottom:180px;
    left:50%;
    transform:translateX(-50%);

    display:flex;
    gap:12px;

    z-index:999;
}

.zoom button{
    width:55px;
    height:55px;

    border-radius:50%;

    border:none;

    background:rgba(0,0,0,0.45);

    backdrop-filter:blur(10px);

    color:white;

    font-weight:bold;
    font-size:18px;

    cursor:pointer;

    border:1px solid rgba(255,255,255,0.15);

    transition:.2s;
}

.zoom button.active{
    background:white;
    color:black;
}

/* BOTTOM */

.bottom{
    width:100%;
    position:absolute;
    bottom:0;
    left:0;

    padding:20px;

    background:linear-gradient(
    to top,
    rgba(0,0,0,0.97),
    rgba(0,0,0,0.5),
    transparent
    );

    z-index:999;
}

/* MODES */

.modes{
    width:100%;

    display:flex;
    justify-content:center;
    gap:28px;

    margin-bottom:20px;
}

.modes button{

    border:none;
    background:none;

    color:white;

    font-size:20px;
    font-weight:700;

    opacity:.5;

    cursor:pointer;
}

.modes .active{
    opacity:1;
}

/* CONTROLS */

.controls{
    width:100%;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

/* GALLERY */

.gallery{
    width:65px;
    height:65px;

    border-radius:18px;

    overflow:hidden;

    border:2px solid rgba(255,255,255,0.25);
}

.gallery img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* CAPTURE */

.capture{
    width:95px;
    height:95px;

    border-radius:50%;

    border:6px solid white;

    background:#ececec;

    cursor:pointer;

    transition:.15s;

    box-shadow:
    0 0 20px rgba(255,255,255,0.2),
    inset 0 0 10px rgba(255,255,255,0.6);
}

.capture:active{
    transform:scale(.88);
}

/* SIDE BUTTONS */

.side-buttons{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.side-buttons button{

    width:60px;
    height:60px;

    border:none;

    border-radius:50%;

    background:rgba(0,0,0,0.45);

    color:white;

    font-size:22px;

    cursor:pointer;

    backdrop-filter:blur(10px);

    border:1px solid rgba(255,255,255,0.12);

    transition:.2s;
}

.side-buttons button:hover{
    transform:scale(1.05);
}

/* RESPONSIVO */

@media(max-width:450px){

    .phone{
        width:100%;
        height:100vh;
        border:none;
        border-radius:0;
    }

}

</style>
</head>

<body>

<div class="phone">

    <!-- NOTCH -->
    <div class="notch"></div>

    <!-- STATUS -->
    <div class="status-bar">

        <span id="clock">06:07</span>

        <div class="status-icons">
            <i class="fa-solid fa-signal"></i>
            <i class="fa-solid fa-wifi"></i>
            <i class="fa-solid fa-battery-full"></i>
        </div>

    </div>

    <!-- MENU -->
    <div class="top-menu">

        <i class="fa-solid fa-bolt"></i>
        <i class="fa-solid fa-wand-magic-sparkles"></i>
        <i class="fa-solid fa-layer-group"></i>
        <i class="fa-solid fa-moon"></i>
        <i class="fa-solid fa-gear"></i>

    </div>

    <!-- CAMERA -->
    <div class="camera-area">

        <video id="video" autoplay playsinline></video>

        <!-- FLASH -->
        <div class="flash" id="flash"></div>

        <!-- GRID -->
        <div class="grid" id="grid">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>

        <!-- FOCUS -->
        <div class="focus" id="focus"></div>

    </div>

    <!-- ZOOM -->
    <div class="zoom">

        <button>0.5</button>
        <button class="active">1x</button>
        <button>2x</button>

    </div>

    <!-- BOTTOM -->
    <div class="bottom">

        <!-- MODES -->
        <div class="modes">

            <button>Retrato</button>
            <button class="active">Foto</button>
            <button>Vídeo</button>

        </div>

        <!-- CONTROLS -->
        <div class="controls">

            <!-- GALLERY -->
            <div class="gallery">

                <img id="galleryImg"
                src="https://images.unsplash.com/photo-1517841905240-472988babdf9?q=80&w=400"
                alt="">

            </div>

            <!-- CAPTURE -->
            <button class="capture" id="capture"></button>

            <!-- SIDE -->
            <div class="side-buttons">

                <button id="switchCamera">
                    <i class="fa-solid fa-rotate"></i>
                </button>

                <button id="toggleGrid">
                    <i class="fa-solid fa-border-all"></i>
                </button>

            </div>

        </div>

    </div>

    <canvas id="canvas" style="display:none;"></canvas>

</div>

<script>

/* ELEMENTOS */

const video = document.getElementById("video");
const capture = document.getElementById("capture");
const canvas = document.getElementById("canvas");
const flash = document.getElementById("flash");
const focus = document.getElementById("focus");
const clock = document.getElementById("clock");
const switchCamera = document.getElementById("switchCamera");
const toggleGrid = document.getElementById("toggleGrid");
const grid = document.getElementById("grid");
const galleryImg = document.getElementById("galleryImg");

let currentCamera = "environment";
let currentStream = null;

/* RELOGIO */

function updateClock(){

    const now = new Date();

    let h = now.getHours().toString().padStart(2,"0");
    let m = now.getMinutes().toString().padStart(2,"0");

    clock.innerHTML = `${h}:${m}`;

}

setInterval(updateClock,1000);

updateClock();

/* CAMERA */

async function startCamera(){

    try{

        if(currentStream){

            currentStream.getTracks().forEach(track=>{
                track.stop();
            });

        }

        const stream = await navigator.mediaDevices.getUserMedia({

            video:{
                facingMode:currentCamera
            },

            audio:false

        });

        currentStream = stream;

        video.srcObject = stream;

    }catch(error){

        alert("Erro ao acessar câmera");

        console.error(error);

    }

}

startCamera();

/* TROCAR CAMERA */

switchCamera.addEventListener("click",()=>{

    currentCamera =
    currentCamera === "user"
    ? "environment"
    : "user";

    startCamera();

});

/* FOTO */

capture.addEventListener("click",()=>{

    /* FLASH */

    flash.style.opacity = "1";

    setTimeout(()=>{

        flash.style.opacity = "0";

    },120);

    /* SOM */

    const audio = new Audio(
    "https://actions.google.com/sounds/v1/camera/camera_shutter_click_01.mp3"
    );

    audio.volume = 0.4;

    audio.play();

    /* FOTO */

    const ctx = canvas.getContext("2d");

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );

    const image = canvas.toDataURL("image/png");

    /* GALERIA */

    galleryImg.src = image;

    /* DOWNLOAD */

    const link = document.createElement("a");

    link.href = image;

    link.download = "foto.png";

    link.click();

});

/* FOCO */

video.addEventListener("click",(e)=>{

    const rect = video.getBoundingClientRect();

    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    focus.style.left = `${x - 45}px`;
    focus.style.top = `${y - 45}px`;

    focus.style.display = "block";

    setTimeout(()=>{

        focus.style.display = "none";

    },700);

});

/* GRID */

let gridEnabled = false;

toggleGrid.addEventListener("click",()=>{

    gridEnabled = !gridEnabled;

    grid.style.display =
    gridEnabled
    ? "block"
    : "none";

});

</script>

</body>
</html>
