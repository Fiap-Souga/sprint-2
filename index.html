<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <title>iPhone Camera Pro + AI Organizer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
    
    <!-- ML5.js para classificação de imagens -->
    <script src="https://unpkg.com/ml5@0.4.3/dist/ml5.min.js"></script>
    
    <style>
        :root {
            --primary-color: #ffd000;
            --accent-color: #00ff88;
            --bg-primary: #000;
            --text-primary: #fff;
            --border-color: rgba(255,255,255,0.12);
            --blur-bg: rgba(0,0,0,0.4);
            --success: #00ff88;
            --folder-bg: rgba(0,255,136,0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            width: 100%;
            height: 100vh;
            background: var(--bg-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: manipulation;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .phone {
            width: 100%;
            height: 100vh;
            max-width: 400px;
            max-height: 900px;
            background: linear-gradient(145deg, #1a1a1a, #0d0d0d);
            border-radius: 32px;
            overflow: hidden;
            position: relative;
            margin: 8px;
            box-shadow: 0 20px 60px -12px rgba(0,0,0,0.8);
        }

        .status-bar {
            position: absolute;
            top: env(safe-area-inset-top);
            left: 0;
            right: 0;
            padding: 12px 24px 8px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            color: var(--text-primary);
            z-index: 999;
            font-size: 14px;
            font-weight: 500;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(20px);
            padding-top: max(20px, env(safe-area-inset-top));
        }

        .top-menu {
            position: absolute;
            top: 70px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-evenly;
            padding: 12px 0;
            color: var(--text-primary);
            z-index: 999;
            background: var(--blur-bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
        }

        .top-menu i, .top-menu button {
            cursor: pointer;
            transition: all 0.25s ease;
            padding: 8px;
            border-radius: 12px;
            opacity: 0.8;
            font-size: 26px;
            background: none;
            border: none;
            color: var(--text-primary);
        }

        .top-menu i:hover, .top-menu button:hover {
            opacity: 1;
            transform: scale(1.15);
            background: rgba(255,255,255,0.1);
        }

        .camera-area {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
            transform: scaleX(1);
        }

        .camera-user video {
            transform: scaleX(-1) !important;
        }

        .flash {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, #fff 0%, #ffd000 30%, transparent 70%);
            opacity: 0;
            pointer-events: none;
            transition: all 0.2s ease-out;
        }

        .grid {
            position: absolute;
            inset: 0;
            pointer-events: none;
            display: none;
            opacity: 0.4;
        }

        .grid span {
            position: absolute;
            background: var(--accent-color);
        }

        .grid span:nth-child(1), .grid span:nth-child(2) { width: 1px; height: 100%; }
        .grid span:nth-child(3), .grid span:nth-child(4) { height: 1px; width: 100%; }
        .grid span:nth-child(1) { left: 33.33%; }
        .grid span:nth-child(2) { left: 66.66%; }
        .grid span:nth-child(3) { top: 33.33%; }
        .grid span:nth-child(4) { top: 66.66%; }

        .focus {
            width: 100px;
            height: 100px;
            border: 2px solid var(--primary-color);
            border-radius: 20px;
            position: absolute;
            display: none;
            pointer-events: none;
            animation: focusPulse 0.8s ease;
        }

        @keyframes focusPulse {
            0% { transform: scale(1.8); opacity: 0; }
            100% { transform: scale(1); opacity: 0; }
        }

        /* NOVO: SISTEMA DE PASTAS AI */
        .ai-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: white;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .ai-overlay.show {
            display: flex;
        }

        .ai-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .ai-result {
            font-size: 18px;
            margin-bottom: 20px;
            opacity: 0;
            animation: fadeIn 0.5s forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .folder-tag {
            background: var(--folder-bg);
            padding: 12px 24px;
            border-radius: 25px;
            border: 2px solid var(--success);
            font-weight: 600;
            font-size: 20px;
            margin: 10px 0;
            backdrop-filter: blur(10px);
        }

        .ai-buttons {
            display: flex;
            gap: 16px;
            margin-top: 30px;
        }

        .ai-btn {
            padding: 14px 28px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .confirm-btn {
            background: var(--success);
            color: white;
        }

        .change-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .zoom, .bottom {
            /* mesmos estilos anteriores */
            position: absolute;
            z-index: 999;
        }

        .zoom {
            bottom: 260px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            padding: 12px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(25px);
            border-radius: 28px;
            border: 1px solid var(--border-color);
        }

        .zoom button {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            border: none;
            background: rgba(0,0,0,0.6);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .zoom button.active {
            background: white;
            color: black;
        }

        .bottom {
            bottom: 0;
            left: 0;
            right: 0;
            padding: 32px 24px 24px;
            background: linear-gradient(to top, rgba(0,0,0,0.98) 0%, transparent 100%);
        }

        .modes {
            display: flex;
            justify-content: center;
            gap: 28px;
            margin-bottom: 24px;
        }

        .modes button {
            background: none;
            border: none;
            color: rgba(255,255,255,0.6);
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        .modes button.active {
            color: white;
            background: rgba(255,255,255,0.15);
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .gallery {
            width: 68px;
            height: 68px;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.3);
            cursor: pointer;
        }

        .capture {
            width: 82px;
            height: 82px;
            border-radius: 50%;
            border: 7px solid rgba(255,255,255,0.85);
            background: white;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .side-buttons {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .side-buttons button {
            width: 60px;
            height: 60px;
            border-radius: 18px;
            background: rgba(0,0,0,0.5);
            border: none;
            color: white;
            cursor: pointer;
        }

        @media (max-width: 430px) {
            .phone { margin: 0; border-radius: 24px; width: 100vw; height: 100vh; }
        }
    </style>
</head>

<body>
    <div class="phone">
        <!-- Status bar -->
        <div class="status-bar">
            <div><span id="clock">09:15</span></div>
            <div>
                <i class="fa-solid fa-signal-bars-good"></i>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-three-quarters"></i>
            </div>
        </div>

        <!-- Top menu -->
        <div class="top-menu">
            <i class="fa-solid fa-bolt"></i>
            <i class="fa-solid fa-wand-magic-sparkles"></i>
            <i title="AI Organizer"><i class="fa-solid fa-folder-open"></i></i>
            <i class="fa-solid fa-moon"></i>
            <i class="fa-solid fa-gear"></i>
        </div>

        <!-- Camera -->
        <div class="camera-area">
            <video id="video" autoplay playsinline muted></video>
            <div class="flash" id="flash"></div>
            <div class="grid" id="grid"><span></span><span></span><span></span><span></span></div>
            <div class="focus" id="focus"></div>
            
            <!-- AI OVERLAY -->
            <div class="ai-overlay" id="aiOverlay">
                <div class="ai-spinner"></div>
                <div class="ai-result" id="aiResult">Analisando com IA...</div>
                <div class="folder-tag" id="folderTag"></div>
                <div class="ai-buttons">
                    <button class="ai-btn confirm-btn" id="confirmFolder">Salvar aqui ✓</button>
                    <button class="ai-btn change-btn" id="changeFolder">Mudar pasta</button>
                </div>
            </div>
        </div>

        <!-- Zoom & Bottom (mesmo código anterior) -->
        <div class="zoom">
            <button data-zoom="0.5">0.5x</button>
            <button class="active" data-zoom="1">1x</button>
            <button data-zoom="2">2x</button>
        </div>

        <div class="bottom">
            <div class="modes">
                <button>Retrato</button>
                <button class="active">Foto</button>
                <button>Vídeo</button>
            </div>
            <div class="controls">
                <div class="gallery" id="gallery">
                    <img id="galleryImg" src="https://images.unsplash.com/photo-1517841905240-472988babdf9?q=80&w=400" alt="">
                </div>
                <button class="capture" id="capture"></button>
                <div class="side-buttons">
                    <button id="switchCamera"><i class="fa-solid fa-rotate"></i></button>
                    <button id="toggleGrid"><i class="fa-solid fa-border-all"></i></button>
                </div>
            </div>
        </div>

        <canvas id="canvas" style="display: none;"></canvas>
        <img id="aiImage" style="display: none;">
    </div>

    <script>
        class AICameraOrganizer {
            constructor() {
                this.video = document.getElementById("video");
                this.capture = document.getElementById("capture");
                this.canvas = document.getElementById("canvas");
                this.aiImage = document.getElementById("aiImage");
                this.flash = document.getElementById("flash");
                this.focus = document.getElementById("focus");
                this.clock = document.getElementById("clock");
                this.galleryImg = document.getElementById("galleryImg");
                this.aiOverlay = document.getElementById("aiOverlay");
                this.aiResult = document.getElementById("aiResult");
                this.folderTag = document.getElementById("folderTag");
                this.confirmFolder = document.getElementById("confirmFolder");
                this.changeFolder = document.getElementById("changeFolder");

                this.currentCamera = "environment";
                this.currentStream = null;
                this.classifier = null;
                this.currentPhotoData = null;
                this.folders = {
                    'food': '🍔 Comida',
                    'person': '👤 Pessoas', 
                    'car': '🚗 Carros',
                    'animal': '🐶 Animais',
                    'landscape': '🌄 Paisagens',
                    'object': '📦 Objetos',
                    'text': '📄 Documentos'
                };

                this.init();
            }

            async init() {
                this.updateClock();
                setInterval(() => this.updateClock(), 1000);
                
                // Carregar modelo ML5.js MobileNet
                this.classifier = await ml5.imageClassifier('MobileNet', () => {
                    console.log('🤖 AI Organizer carregado!');
                });
                
                this.bindEvents();
                this.startCamera();
            }

            async startCamera() {
                try {
                    if (this.currentStream) {
                        this.currentStream.getTracks().forEach(track => track.stop());
                    }
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: this.currentCamera }
                    });
                    this.currentStream = stream;
                    this.video.srcObject = stream;
                    this.video.classList.toggle('camera-user', this.currentCamera === 'user');
                    await this.video.play();
                } catch (e) {
                    alert('Permita acesso à câmera!');
                }
            }

            bindEvents() {
                document.getElementById("switchCamera").onclick = () => {
                    this.currentCamera = this.currentCamera === "user" ? "environment" : "user";
                    this.startCamera();
                };

                this.capture.onclick = () => this.capturePhoto();

                this.video.onclick = (e) => this.handleFocus(e);

                document.getElementById("toggleGrid").onclick = () => {
                    const grid = document.getElementById("grid");
                    grid.style.display = grid.style.display === 'block' ? 'none' : 'block';
                };

                this.confirmFolder.onclick = () => this.saveToFolder();
                this.changeFolder.onclick = () => this.aiOverlay.classList.remove('show');
            }

            updateClock() {
                const now = new Date();
                this.clock.textContent = now.toLocaleTimeString('pt-BR', {hour: '2-digit', minute: '2-digit'});
            }

            async capturePhoto() {
                this.flash.style.opacity = "0.85";
                setTimeout(() => this.flash.style.opacity = "0", 150);

                // Capturar imagem
                this.canvas.width = this.video.videoWidth;
                this.canvas.height = this.video.videoHeight;
                const ctx = this.canvas.getContext("2d");
                
                ctx.save();
                if (this.currentCamera === 'user') {
                    ctx.scale(-1, 1);
                    ctx.drawImage(this.video, -this.canvas.width, 0);
                } else {
                    ctx.drawImage(this.video, 0, 0);
                }
                ctx.restore();
                
                this.currentPhotoData = this.canvas.toDataURL("image/jpeg", 0.9);
                this.galleryImg.src = this.currentPhotoData;

                // Iniciar análise AI
                this.analyzeWithAI();
            }

            analyzeWithAI() {
                // Mostrar overlay
                this.aiOverlay.classList.add('show');
                this.aiResult.textContent = '🤖 IA analisando...';

                // Colocar imagem na AI
                this.aiImage.src = this.currentPhotoData;
                this.aiImage.onload = () => {
                    this.classifier.classify(this.aiImage, (error, results) => {
                        if (error) {
                            console.error(error);
                            this.aiResult.textContent = 'Erro na análise';
                            return;
                        }
                        
                        const topResult = results[0];
                        const confidence = (topResult.confidence * 100).toFixed(1);
                        
                        // Mapear para pastas inteligentes
                        let folder = this.getSmartFolder(topResult.label);
                        this.folderTag.textContent = `${folder} (${confidence}%)`;
                        this.aiResult.textContent = `Detectado: ${topResult.label}`;
                    });
                };
            }

            getSmartFolder(label) {
                const lowerLabel = label.toLowerCase();
                
                if (lowerLabel.includes('food') || lowerLabel.includes('pizza') || lowerLabel.includes('cake') || 
                    lowerLabel.includes('burger') || lowerLabel.includes('pasta') || lowerLabel.includes('bread')) {
                    return this.folders.food;
                }
                if (lowerLabel.includes('person') || lowerLabel.includes('man') || lowerLabel.includes('woman') || 
                    lowerLabel.includes('child') || lowerLabel.includes('baby')) {
                    return this.folders.person;
                }
                if (lowerLabel.includes('car') || lowerLabel.includes('truck') || lowerLabel.includes('vehicle')) {
                    return this.folders.car;
                }
                if (lowerLabel.includes('dog') || lowerLabel.includes('cat') || lowerLabel.includes('animal')) {
                    return this.folders.animal;
                }
                if (lowerLabel.includes('mountain') || lowerLabel.includes('beach') || lowerLabel.includes('tree') || 
                    lowerLabel.includes('sky') || lowerLabel.includes('sea')) {
                    return this.folders.landscape;
                }
                return this.folders.object;
            }

            saveToFolder() {
                const folderName = this.folderTag.textContent.split(' ')[0];
                
                // Criar link com nome da pasta
                const link = document.createElement("a");
                link.href = this.currentPhotoData;
                link.download = `${folderName}_${Date.now()}.jpg`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                // Feedback
                this.folderTag.style.background = 'rgba(0,255,136,0.3)';
                setTimeout(() => {
                    this.aiOverlay.classList.remove('show');
                    this.folderTag.style.background = 'var(--folder-bg)';
                }, 1500);
            }

            handleFocus(e) {
                const rect = this.video.getBoundingClientRect();
                const x = (e.clientX - rect.left) / rect.width * 100;
                const y = (e.clientY - rect.top) / rect.height * 100;
                
                this.focus.style.left = `calc(${x}% - 50px)`;
                this.focus.style.top = `calc(${y}% - 50px)`;
                this.focus.style.display = "block";
                setTimeout(() => this.focus.style.display = "none", 800);
            }
        }

        // Inicializar
        window.addEventListener('load', () => new AICameraOrganizer());
    </script>
</body>
</html>
