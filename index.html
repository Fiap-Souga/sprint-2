<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <title>Samsung Camera Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
    <script src="https://unpkg.com/ml5@0.4.3/dist/ml5.min.js"></script>
    
    <style>
        :root {
            --primary-gold: #ffc107;
            --accent-green: #00c853;
            --bg-black: #000;
            --text-white: #fff;
            --glass-bg: rgba(255,255,255,0.08);
            --glass-border: rgba(255,255,255,0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            width: 100%;
            height: 100vh;
            background: var(--bg-black);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: manipulation;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .phone {
            width: 100%;
            height: 100vh;
            max-width: 400px;
            max-height: 900px;
            background: linear-gradient(145deg, #1a1a1a, #0d0d0d);
            border-radius: 32px;
            overflow: hidden;
            position: relative;
            margin: 8px;
            box-shadow: 0 20px 60px -12px rgba(0,0,0,0.8);
        }

        .status-bar {
            position: absolute;
            top: env(safe-area-inset-top);
            left: 0;
            right: 0;
            padding: 12px 24px 8px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            color: var(--text-white);
            z-index: 999;
            font-size: 14px;
            font-weight: 500;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(20px);
            padding-top: max(20px, env(safe-area-inset-top));
        }

        /* Interface limpa - inspirada Samsung */
        .top-controls {
            position: absolute;
            top: 80px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 999;
        }

        .camera-switch {
            width: 44px;
            height: 44px;
            border-radius: 22px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-white);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .camera-switch:hover {
            background: rgba(255,255,255,0.15);
            transform: scale(1.05);
        }

        .zoom-slider {
            display: flex;
            gap: 8px;
            background: var(--glass-bg);
            padding: 8px 12px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
        }

        .zoom-btn {
            width: 36px;
            height: 36px;
            border-radius: 18px;
            border: none;
            background: transparent;
            color: var(--text-white);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            opacity: 0.7;
        }

        .zoom-btn.active {
            background: var(--primary-gold);
            color: #000;
            opacity: 1;
        }

        .camera-area {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
        }

        /* SEM INVERSÃO na câmera frontal */
        .camera-user video {
            transform: none !important;
        }

        .flash {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, #fff 0%, #ffc107 30%, transparent 70%);
            opacity: 0;
            pointer-events: none;
            transition: all 0.2s ease-out;
        }

        .focus-ring {
            width: 120px;
            height: 120px;
            border: 2px solid var(--primary-gold);
            border-radius: 50%;
            position: absolute;
            display: none;
            pointer-events: none;
            animation: focusPulse 0.6s ease-out;
            box-shadow: 0 0 20px rgba(255,193,7,0.5);
        }

        @keyframes focusPulse {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(1.2); opacity: 0; }
        }

        /* AI Overlay mais limpo */
        .ai-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: white;
            text-align: center;
            backdrop-filter: blur(20px);
            gap: 24px;
        }

        .ai-overlay.show {
            display: flex;
        }

        .ai-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255,255,255,0.2);
            border-top: 3px solid var(--primary-gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .folder-suggestion {
            background: rgba(0,200,83,0.15);
            padding: 16px 32px;
            border-radius: 28px;
            border: 2px solid var(--accent-green);
            font-size: 18px;
            font-weight: 600;
        }

        .ai-buttons {
            display: flex;
            gap: 12px;
        }

        .ai-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 120px;
        }

        .confirm-btn {
            background: var(--accent-green);
            color: white;
        }

        .change-btn {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
        }

        /* Bottom controls limpos - Samsung style */
        .bottom-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 999;
        }

        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 24px;
        }

        .mode-btn {
            background: none;
            border: none;
            color: rgba(255,255,255,0.6);
            font-size: 16px;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .mode-btn.active {
            color: var(--text-white);
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
        }

        .capture-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .gallery-btn {
            width: 64px;
            height: 64px;
            border-radius: 18px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.3);
            cursor: pointer;
            transition: all 0.2s ease;
            background: var(--glass-bg);
        }

        .gallery-btn:hover {
            border-color: var(--primary-gold);
            transform: scale(1.05);
        }

        .gallery-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .capture-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 6px solid rgba(255,255,255,0.8);
            background: white;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            transition: all 0.2s ease;
        }

        .capture-btn:active {
            transform: scale(0.95);
        }

        .grid-toggle {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-white);
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .grid-toggle:hover {
            background: rgba(255,255,255,0.15);
        }

        .grid-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            display: none;
            opacity: 0.4;
        }

        .grid-line {
            position: absolute;
            background: var(--accent-green);
        }

        .grid-line.v { width: 1px; height: 100%; }
        .grid-line.h { height: 1px; width: 100%; }
        .grid-line:nth-child(1) { left: 33%; }
        .grid-line:nth-child(2) { left: 67%; }
        .grid-line:nth-child(3) { top: 33%; }
        .grid-line:nth-child(4) { top: 67%; }

        canvas, #aiImage {
            display: none;
        }

        @media (max-width: 430px) {
            .phone { margin: 0; border-radius: 24px; width: 100vw; height: 100vh; }
        }
    </style>
</head>

<body>
    <div class="phone">
        <!-- Status bar -->
        <div class="status-bar">
            <div><span id="clock">09:32</span></div>
            <div>
                <i class="fa-solid fa-signal-bars-good"></i>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-three-quarters"></i>
            </div>
        </div>

        <!-- Top controls (limpos) -->
        <div class="top-controls">
            <div class="camera-switch" id="switchCamera" title="Trocar câmera">
                <i class="fa-solid fa-rotate"></i>
            </div>
            <div class="zoom-slider">
                <button class="zoom-btn" data-zoom="0.5">0.5x</button>
                <button class="zoom-btn active" data-zoom="1">1x</button>
                <button class="zoom-btn" data-zoom="2">2x</button>
            </div>
        </div>

        <!-- Camera area -->
        <div class="camera-area">
            <video id="video" autoplay playsinline muted></video>
            <div class="flash" id="flash"></div>
            <div class="grid-overlay" id="grid">
                <div class="grid-line"></div>
                <div class="grid-line"></div>
                <div class="grid-line"></div>
                <div class="grid-line"></div>
            </div>
            <div class="focus-ring" id="focus"></div>

            <!-- AI Overlay -->
            <div class="ai-overlay" id="aiOverlay">
                <div class="ai-spinner"></div>
                <div class="folder-suggestion" id="folderTag">Analisando...</div>
                <div class="ai-buttons">
                    <button class="ai-btn confirm-btn" id="confirmFolder">Salvar ✓</button>
                    <button class="ai-btn change-btn" id="changeFolder">Cancelar</button>
                </div>
            </div>
        </div>

        <!-- Bottom controls -->
        <div class="bottom-controls">
            <div class="mode-selector">
                <button class="mode-btn">Retrato</button>
                <button class="mode-btn active">Foto</button>
                <button class="mode-btn">Vídeo</button>
            </div>
            <div class="capture-row">
                <div class="gallery-btn" id="gallery">
                    <img id="galleryImg" src="https://images.unsplash.com/photo-1517841905240-472988babdf9?q=80&w=400" alt="">
                </div>
                <button class="capture-btn" id="capture"></button>
                <div class="grid-toggle" id="toggleGrid" title="Grade">
                    <i class="fa-solid fa-border-all"></i>
                </div>
            </div>
        </div>

        <canvas id="canvas"></canvas>
        <img id="aiImage">
    </div>

    <script>
        class SamsungCameraPro {
            constructor() {
                this.video = document.getElementById("video");
                this.capture = document.getElementById("capture");
                this.canvas = document.getElementById("canvas");
                this.aiImage = document.getElementById("aiImage");
                this.flash = document.getElementById("flash");
                this.focus = document.getElementById("focus");
                this.clock = document.getElementById("clock");
                this.galleryImg = document.getElementById("galleryImg");
                this.aiOverlay = document.getElementById("aiOverlay");
                this.folderTag = document.getElementById("folderTag");
                this.confirmFolder = document.getElementById("confirmFolder");
                this.changeFolder = document.getElementById("changeFolder");

                this.currentCamera = "environment"; // Começa com câmera traseira
                this.currentStream = null;
                this.classifier = null;
                this.currentPhotoData = null;
                this.zoomLevel = 1;
                this.isGridVisible = false;

                this.folders = {
                    'food': '🍔 Comida',
                    'person': '👤 Pessoas', 
                    'car': '🚗 Carros',
                    'animal': '🐶 Animais',
                    'landscape': '🌄 Paisagens',
                    'object': '📦 Objetos',
                    'text': '📄 Documentos'
                };

                this.init();
            }

            async init() {
                this.updateClock();
                setInterval(() => this.updateClock(), 1000);
                
                // ML5.js
                this.classifier = await ml5.imageClassifier('MobileNet', () => {
                    console.log('🤖 AI carregada!');
                });
                
                this.bindEvents();
                this.startCamera();
            }

            async startCamera() {
                try {
                    if (this.currentStream) {
                        this.currentStream.getTracks().forEach(track => track.stop());
                    }

                    const constraints = {
                        video: { 
                            facingMode: this.currentCamera,
                            width: { ideal: 1920 },
                            height: { ideal: 1080 }
                        }
                    };

                    const stream = await navigator.mediaDevices.getUserMedia(constraints);
                    this.currentStream = stream;
                    this.video.srcObject = stream;
                    
                    // ✅ SEM INVERSÃO na câmera frontal
                    this.video.classList.toggle('camera-user', this.currentCamera === 'user');
                    
                    await this.video.play();
                    this.applyZoom();
                } catch (e) {
                    console.error('Erro câmera:', e);
                    alert('Permita acesso à câmera!');
                }
            }

            bindEvents() {
                // Switch câmera
                document.getElementById("switchCamera").onclick = () => {
                    this.currentCamera = this.currentCamera === "user" ? "environment" : "user";
                    this.startCamera();
                };

                // ✅ Galeria mais confiável
                document.getElementById("gallery").onclick = (e) => {
                    e.stopPropagation();
                    if (this.currentPhotoData) {
                        window.open(this.currentPhotoData, '_blank');
                    }
                };

                // Capture
                this.capture.onclick = () => this.capturePhoto();

                // Focus
                this.video.onclick = (e) => this.handleFocus(e);

                // Grid toggle
                document.getElementById("toggleGrid").onclick = () => {
                    this.isGridVisible = !this.isGridVisible;
                    document.getElementById("grid").style.display = this.isGridVisible ? 'block' : 'none';
                };

                // Zoom
                document.querySelectorAll('.zoom-btn').forEach(btn => {
                    btn.onclick = () => {
                        this.zoomLevel = parseFloat(btn.dataset.zoom);
                        document.querySelectorAll('.zoom-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        this.applyZoom();
                    };
                });

                // AI buttons
                this.confirmFolder.onclick = () => this.saveToFolder();
                this.changeFolder.onclick = () => this.aiOverlay.classList.remove('show');
            }

            applyZoom() {
                const transform = `scale(${this.zoomLevel})`;
                this.video.style.transform = transform;
            }

            updateClock() {
                const now = new Date();
                this.clock.textContent = now.toLocaleTimeString('pt-BR', {hour: '2-digit', minute: '2-digit'});
            }

            async capturePhoto() {
                this.flash.style.opacity = "0.9";
                setTimeout(() => this.flash.style.opacity = "0", 200);

                // Captura SEM inversão na frontal
                this.canvas.width = this.video.videoWidth;
                this.canvas.height = this.video.videoHeight;
                const ctx = this.canvas.getContext("2d");
                ctx.drawImage(this.video, 0, 0); // SEM scale(-1,1)
                
                this.currentPhotoData = this.canvas.toDataURL("image/jpeg", 0.92);
                this.galleryImg.src = this.currentPhotoData;
                this.analyzeWithAI();
            }

            analyzeWithAI() {
                this.aiOverlay.classList.add('show');
                this.folderTag.textContent = '🤖 Analisando...';

                this.aiImage.src = this.currentPhotoData;
                this.aiImage.onload = () => {
                    this.classifier.classify(this.aiImage, (error, results) => {
                        if (error) {
                            this.folderTag.textContent = 'Erro na análise';
                            return;
                        }
                        
                        const topResult = results[0];
                        const folder = this.getSmartFolder(topResult.label);
                        const confidence = (topResult.confidence * 100).toFixed(0);
                        this.folderTag.textContent = `${folder} (${confidence}%)`;
                    });
                };
            }

            getSmartFolder(label) {
                const lowerLabel = label.toLowerCase();
                if (lowerLabel.includes('food') || lowerLabel.includes('pizza') || lowerLabel.includes('cake')) {
                    return this.folders.food;
                }
                if (lowerLabel.includes('person') || lowerLabel.includes('man') || lowerLabel.includes('woman')) {
                    return this.folders.person;
                }
                if (lowerLabel.includes('car') || lowerLabel.includes('vehicle')) {
                    return this.folders.car;
                }
                if (lowerLabel.includes('dog') || lowerLabel.includes('cat') || lowerLabel.includes('animal')) {
                    return this.folders.animal;
                }
                if (lowerLabel.includes('mountain') || lowerLabel.includes('beach') || lowerLabel.includes('tree')) {
                    return this.folders.landscape;
                }
                return this.folders.object;
            }

            saveToFolder() {
                const folderName = this.folderTag.textContent.split(' ')[0];
                const link = document.createElement("a");
                link.href = this.currentPhotoData;
                link.download = `${folderName}_${Date.now()}.jpg`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                this.folderTag.style.background = 'rgba(0,200,83,0.3)';
                setTimeout(() => {
                    this.aiOverlay.classList.remove('show');
                    this.folderTag.style.background = '';
                }, 1200);
            }

            handleFocus(e) {
                const rect = this.video.getBoundingClientRect();
                const x = e.clientX - rect.left - 60;
                const y = e.clientY - rect.top - 60;
                
                this.focus.style.left = x + 'px';
                this.focus.style.top = y + 'px';
                this.focus.style.display = "block";
                setTimeout(() => this.focus.style.display = "none", 600);
            }
        }

        window.addEventListener('load', () => new SamsungCameraPro());
    </script>
</body>
</html>
