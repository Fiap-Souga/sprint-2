<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <title>Samsung Camera Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
    
    <style>
        :root {
            --primary-gold: #ffc107;
            --accent-green: #00c853;
            --bg-black: #000;
            --text-white: #fff;
            --glass-bg: rgba(255,255,255,0.08);
            --glass-border: rgba(255,255,255,0.12);
            --delete-red: #ff4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            width: 100%;
            height: 100vh;
            background: var(--bg-black);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: manipulation;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .phone {
            width: 100%;
            height: 100vh;
            max-width: 400px;
            max-height: 900px;
            background: linear-gradient(145deg, #1a1a1a, #0d0d0d);
            border-radius: 32px;
            overflow: hidden;
            position: relative;
            margin: 8px;
            box-shadow: 0 20px 60px -12px rgba(0,0,0,0.8);
        }

        .status-bar {
            position: absolute;
            top: env(safe-area-inset-top);
            left: 0;
            right: 0;
            padding: 12px 24px 8px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            color: var(--text-white);
            z-index: 999;
            font-size: 14px;
            font-weight: 500;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(20px);
            padding-top: max(20px, env(safe-area-inset-top));
        }

        .top-controls {
            position: absolute;
            top: 80px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 999;
        }

        .camera-switch {
            width: 44px;
            height: 44px;
            border-radius: 22px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-white);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .camera-switch:hover {
            background: rgba(255,255,255,0.15);
            transform: scale(1.05);
        }

        .zoom-slider {
            display: flex;
            gap: 8px;
            background: var(--glass-bg);
            padding: 8px 12px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
        }

        .zoom-btn {
            width: 36px;
            height: 36px;
            border-radius: 18px;
            border: none;
            background: transparent;
            color: var(--text-white);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            opacity: 0.7;
        }

        .zoom-btn.active {
            background: var(--primary-gold);
            color: #000;
            opacity: 1;
        }

        .camera-area {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
        }

        video.mirror {
            transform: scaleX(-1);
        }

        .flash {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, #fff 0%, #ffc107 30%, transparent 70%);
            opacity: 0;
            pointer-events: none;
            transition: all 0.2s ease-out;
        }

        .focus-ring {
            width: 120px;
            height: 120px;
            border: 2px solid var(--primary-gold);
            border-radius: 50%;
            position: absolute;
            display: none;
            pointer-events: none;
            animation: focusPulse 0.6s ease-out;
            box-shadow: 0 0 20px rgba(255,193,7,0.5);
        }

        @keyframes focusPulse {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(1.2); opacity: 0; }
        }

        .bottom-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 999;
        }

        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 24px;
        }

        .mode-btn {
            background: none;
            border: none;
            color: rgba(255,255,255,0.6);
            font-size: 16px;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .mode-btn.active {
            color: var(--text-white);
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
        }

        .capture-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .gallery-btn {
            width: 64px;
            height: 64px;
            border-radius: 18px;
            overflow: hidden;
            border: 3px solid rgba(255,255,255,0.4);
            cursor: pointer;
            transition: all 0.2s ease;
            background: var(--glass-bg);
        }

        .gallery-btn:hover {
            border-color: var(--primary-gold);
            transform: scale(1.05);
        }

        .gallery-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .capture-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 6px solid rgba(255,255,255,0.8);
            background: white;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            transition: all 0.2s ease;
        }

        .capture-btn:active {
            transform: scale(0.95);
        }

        .grid-toggle {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-white);
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .grid-toggle:hover {
            background: rgba(255,255,255,0.15);
        }

        /* GALERIA MELHORADA COM AÇÕES */
        .gallery-modal {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.98);
            display: none;
            flex-direction: column;
            z-index: 1001;
            backdrop-filter: blur(20px);
        }

        .gallery-modal.show {
            display: flex;
        }

        .gallery-header {
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            flex-shrink: 0;
            gap: 12px;
        }

        .gallery-controls {
            display: flex;
            gap: 8px;
        }

        .gallery-search {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 12px 16px;
            color: white;
            width: 180px;
            font-size: 14px;
        }

        .category-filter {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 8px 12px;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

        .gallery-grid {
            flex: 1;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 8px;
            overflow-y: auto;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .gallery-grid::-webkit-scrollbar {
            display: none;
        }

        .gallery-photo {
            aspect-ratio: 1;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            border: 2px solid transparent;
            background: var(--glass-bg);
            position: relative;
            scroll-snap-align: start;
        }

        .gallery-photo:hover {
            transform: scale(1.05) translateY(-4px);
            border-color: var(--primary-gold);
            box-shadow: 0 8px 25px rgba(255,193,7,0.3);
        }

        .gallery-photo.selected {
            border-color: var(--primary-gold);
            box-shadow: 0 0 0 3px rgba(255,193,7,0.5);
        }

        .gallery-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .gallery-photo:hover img {
            transform: scale(1.1);
        }

        .photo-date {
            position: absolute;
            bottom: 6px;
            left: 6px;
            background: rgba(0,0,0,0.7);
            color: white;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .photo-folder {
            position: absolute;
            top: 6px;
            right: 6px;
            background: rgba(0,100,200,0.9);
            color: white;
            font-size: 10px;
            padding: 2px 5px;
            border-radius: 4px;
            font-weight: 600;
        }

        /* ✅ BOTÕES DE AÇÃO NA FOTO */
        .photo-actions {
            position: absolute;
            top: 8px;
            right: 8px;
            display: none;
            gap: 4px;
        }

        .gallery-photo:hover .photo-actions,
        .gallery-photo.selected .photo-actions {
            display: flex;
        }

        .action-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: none;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .delete-btn {
            background: var(--delete-red);
            color: white;
        }

        .delete-btn:hover {
            background: #ff6666;
            transform: scale(1.1);
        }

        .edit-btn {
            background: var(--primary-gold);
            color: #000;
        }

        .edit-btn:hover {
            background: #ffd54f;
            transform: scale(1.1);
        }

        .photo-preview {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1002;
        }

        .preview-image {
            max-width: 90%;
            max-height: 90%;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }

        /* ✅ SELETOR DE PASTAS MELHORADO */
        .folder-selector {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            padding: 20px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            display: none;
            flex-direction: column;
            gap: 12px;
            max-width: 90%;
            max-height: 300px;
            overflow-y: auto;
        }

        .folder-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 8px;
        }

        .folder-btn {
            padding: 12px 8px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 16px;
            color: white;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .folder-btn:hover {
            background: var(--primary-gold);
            color: #000;
            transform: translateY(-2px);
        }

        .folder-btn.active {
            background: var(--accent-green);
            color: #000;
            border-color: var(--accent-green);
        }

        .grid-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            display: none;
            opacity: 0.4;
        }

        .grid-line {
            position: absolute;
            background: var(--accent-green);
        }

        .grid-line.v { width: 1px; height: 100%; }
        .grid-line.h { height: 1px; width: 100%; }
        .grid-line:nth-child(1) { left: 33%; }
        .grid-line:nth-child(2) { left: 67%; }
        .grid-line:nth-child(3) { top: 33%; }
        .grid-line:nth-child(4) { top: 67%; }

        canvas {
            display: none;
        }

        @media (max-width: 430px) {
            .phone { margin: 0; border-radius: 24px; width: 100vw; height: 100vh; }
        }
    </style>
</head>

<body>
    <div class="phone">
        <!-- Status bar -->
        <div class="status-bar">
            <div><span id="clock">09:37</span></div>
            <div>
                <i class="fa-solid fa-signal-bars-good"></i>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-three-quarters"></i>
            </div>
        </div>

        <!-- Top controls -->
        <div class="top-controls">
            <div class="camera-switch" id="switchCamera">
                <i class="fa-solid fa-rotate"></i>
            </div>
            <div class="zoom-slider">
                <button class="zoom-btn" data-zoom="0.5">0.5x</button>
                <button class="zoom-btn active" data-zoom="1">1x</button>
                <button class="zoom-btn" data-zoom="2">2x</button>
            </div>
        </div>

        <!-- Camera area -->
        <div class="camera-area">
            <video id="video" autoplay playsinline muted></video>
            <div class="flash" id="flash"></div>
            <div class="grid-overlay" id="grid">
                <div class="grid-line"></div>
                <div class="grid-line"></div>
                <div class="grid-line"></div>
                <div class="grid-line"></div>
            </div>
            <div class="focus-ring" id="focus"></div>
        </div>

        <!-- PREVIEW FLUIDO -->
        <div class="photo-preview" id="photoPreview">
            <img class="preview-image" id="previewImg" src="" alt="">
        </div>

        <!-- GALERIA MELHORADA COM AÇÕES -->
        <div class="gallery-modal" id="galleryModal">
            <div class="gallery-header">
                <input type="text" class="gallery-search" id="gallerySearch" placeholder="Pesquisar fotos...">
                <div class="gallery-controls">
                    <select class="category-filter" id="categoryFilter">
                        <option value="all">Todas</option>
                        <option value="📸 Geral">📸 Geral</option>
                        <option value="👤 Pessoas">👤 Pessoas</option>
                        <option value="🍔 Comida">🍔 Comida</option>
                        <option value="🚗 Carros">🚗 Carros</option>
                        <option value="🌄 Paisagem">🌄 Paisagem</option>
                    </select>
                    <i class="fa-solid fa-xmark" id="closeGallery" style="font-size: 24px; cursor: pointer;"></i>
                </div>
            </div>
            <div class="gallery-grid" id="galleryGrid">
                <!-- Fotos aparecerão aqui -->
            </div>
        </div>

        <!-- SELETOR DE PASTAS MELHORADO -->
        <div class="folder-selector" id="folderSelector">
            <div style="color: white; font-weight: 600; margin-bottom: 8px;">Mover para:</div>
            <div class="folder-grid">
                <button class="folder-btn active" data-folder="📸 Geral"><span>📸</span>Geral</button>
                <button class="folder-btn" data-folder="👤 Pessoas"><span>👤</span>Pessoas</button>
                <button class="folder-btn" data-folder="🍔 Comida"><span>🍔</span>Comida</button>
                <button class="folder-btn" data-folder="🚗 Carros"><span>🚗</span>Carros</button>
                <button class="folder-btn" data-folder="🌄 Paisagem"><span>🌄</span>Paisagem</button>
            </div>
        </div>

        <!-- Bottom controls -->
        <div class="bottom-controls">
            <div class="mode-selector">
                <button class="mode-btn">Retrato</button>
                <button class="mode-btn active">Foto</button>
                <button class="mode-btn">Vídeo</button>
            </div>
            <div class="capture-row">
                <div class="gallery-btn" id="galleryBtn">
                    <img id="galleryThumb" src="https://images.unsplash.com/photo-1517841905240-472988babdf9?q=80&w=400" alt="">
                </div>
                <button class="capture-btn" id="capture"></button>
                <div class="grid-toggle" id="toggleGrid">
                    <i class="fa-solid fa-border-all"></i>
                </div>
            </div>
        </div>

        <canvas id="canvas"></canvas>
    </div>

    <script>
        class SamsungCamera {
            constructor() {
                this.video = document.getElementById("video");
                this.capture = document.getElementById("capture");
                this.canvas = document.getElementById("canvas");
                this.flash = document.getElementById("flash");
                this.focus = document.getElementById("focus");
                this.clock = document.getElementById("clock");
                this.galleryBtn = document.getElementById("galleryBtn");
                this.galleryThumb = document.getElementById("galleryThumb");
                this.galleryModal = document.getElementById("galleryModal");
                this.galleryGrid = document.getElementById("galleryGrid");
                this.folderSelector = document.getElementById("folderSelector");
                this.closeGallery = document.getElementById("closeGallery");
                this.photoPreview = document.getElementById("photoPreview");
                this.previewImg = document.getElementById("previewImg");
                this.gallerySearch = document.getElementById("gallerySearch");
                this.galleryTitle = document.getElementById("galleryTitle");
                this.categoryFilter = document.getElementById("categoryFilter");

                this.currentCamera = "environment";
                this.currentStream = null;
                this.photos = JSON.parse(localStorage.getItem('cameraPhotos')) || [];
                this.selectedPhoto = null;
                this.selectedPhotos = new Set();
                this.zoomLevel = 1;
                this.filteredPhotos = [];
                this.currentFilter = 'all';

                this.init();
            }

            init() {
                this.updateClock();
                setInterval(() => this.updateClock(), 1000);
                this.loadPhotos();
                this.bindEvents();
                this.startCamera();
            }

            async startCamera() {
                try {
                    if (this.currentStream) {
                        this.currentStream.getTracks().forEach(track => track.stop());
                    }

                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { 
                            facingMode: this.currentCamera,
                            width: { ideal: 1920 },
                            height: { ideal: 1080 }
                        }
                    });

                    this.currentStream = stream;
                    this.video.srcObject = stream;
                    this.video.classList.toggle('mirror', this.currentCamera === 'user');
                    await this.video.play();
                    this.applyZoom();
                } catch (e) {
                    alert('Permita acesso à câmera!');
                }
            }

            bindEvents() {
                // Switch camera
                document.getElementById("switchCamera").onclick = () => {
                    this.currentCamera = this.currentCamera === "user" ? "environment" : "user";
                    this.startCamera();
                };

                // Gallery
                this.galleryBtn.onclick = (e) => {
                    e.stopPropagation();
                    this.galleryModal.classList.add('show');
                    document.body.style.overflow = 'hidden';
                };

                document.getElementById("closeGallery").onclick = () => {
                    this.galleryModal.classList.remove('show');
                    document.body.style.overflow = '';
                    this.selectedPhotos.clear();
                };

                // Preview
                this.photoPreview.onclick = () => {
                    this.photoPreview.style.display = 'none';
                };

                // Capture
                this.capture.onclick = () => this.capturePhoto();

                // Focus
                this.video.onclick = (e) => this.handleFocus(e);

                // Grid
                document.getElementById("toggleGrid").onclick = () => {
                    const grid = document.getElementById("grid");
                    grid.style.display = grid.style.display === 'block' ? 'none' : 'block';
                };

                // Zoom
                document.querySelectorAll('.zoom-btn').forEach(btn => {
                    btn.onclick = () => {
                        this.zoomLevel = parseFloat(btn.dataset.zoom);
                        document.querySelectorAll('.zoom-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        this.applyZoom();
                    };
                });

                // Search
                this.gallerySearch.oninput = (e) => {
                    this.filterPhotos(e.target.value);
                };

                // Category filter
                this.categoryFilter.onchange = (e) => {
                    this.currentFilter = e.target.value;
                    this.filterPhotos(this.gallerySearch.value);
                };

                // Folder buttons
                document.querySelectorAll('.folder-btn').forEach(btn => {
                    btn.onclick = () => {
                        if (this.selectedPhoto) {
                            this.movePhotoToFolder(this.selectedPhoto, btn.dataset.folder);
                        }
                    };
                });
            }

            applyZoom() {
                const mirrorScale = this.currentCamera === 'user' ? -1 : 1;
                this.video.style.transform = `scaleX(${mirrorScale}) scale(${this.zoomLevel})`;
            }

            updateClock() {
                const now = new Date();
                this.clock.textContent = now.toLocaleTimeString('pt-BR', {hour: '2-digit', minute: '2-digit'});
            }

            capturePhoto() {
                this.flash.style.opacity = "0.9";
                setTimeout(() => this.flash.style.opacity = "0", 200);

                this.canvas.width = this.video.videoWidth;
                this.canvas.height = this.video.videoHeight;
                const ctx = this.canvas.getContext("2d");
                
                if (this.currentCamera === 'user') {
                    ctx.scale(-1, 1);
                    ctx.drawImage(this.video, -this.canvas.width, 0);
                } else {
                    ctx.drawImage(this.video, 0, 0);
                }
                
                const photoData = this.canvas.toDataURL("image/jpeg", 0.9);
                const photo = {
                    id: Date.now(),
                    data: photoData,
                    date: new Date().toLocaleString('pt-BR'),
                    folder: '📸 Geral'
                };
                
                this.photos.unshift(photo);
                localStorage.setItem('cameraPhotos', JSON.stringify(this.photos));
                this.galleryThumb.src = photoData;
                this.loadPhotos();
            }

            // ✅ NOVA: FILTRAGEM POR CATEGORIA E TEXTO
            filterPhotos(query = '') {
                this.filteredPhotos = this.photos.filter(photo => {
                    const matchesSearch = !query || 
                        photo.date.toLowerCase().includes(query.toLowerCase()) ||
                        photo.folder.toLowerCase().includes(query.toLowerCase());
                    
                    const matchesCategory = this.currentFilter === 'all' || photo.folder === this.currentFilter;
                    
                    return matchesSearch && matchesCategory;
                });
                this.renderGallery();
            }

            loadPhotos() {
                this.filterPhotos();
            }

            // ✅ NOVA: RENDERIZAR COM BOTÕES DE AÇÃO
            renderGallery() {
                this.galleryGrid.innerHTML = '';
                this.filteredPhotos.slice(0, 30).forEach((photo) => {
                    const div = document.createElement('div');
                    div.className = 'gallery-photo';
                    div.innerHTML = `
                        <img src="${photo.data}" alt="${photo.date}">
                        <div class="photo-date">${photo.date.split(',')[0]}</div>
                        <div class="photo-folder">${photo.folder}</div>
                        <div class="photo-actions">
                            <button class="action-btn edit-btn" title="Categorizar">
                                <i class="fa-solid fa-folder"></i>
                            </button>
                            <button class="action-btn delete-btn" title="Excluir">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    `;
                    
                    // Seleção múltipla
                    div.onclick = (e) => {
                        e.stopPropagation();
                        if (e.target.closest('.action-btn')) return;
                        
                        if (this.selectedPhotos.has(photo.id)) {
                            this.selectedPhotos.delete(photo.id);
                            div.classList.remove('selected');
                        } else {
                            this.selectedPhotos.add(photo.id);
                            div.classList.add('selected');
                        }
                        
                        this.selectedPhoto = this.selectedPhotos.size === 1 ? photo : null;
                        this.folderSelector.style.display = this.selectedPhoto ? 'flex' : 'none';
                    };

                    // Botão editar/categorizar
                    div.querySelector('.edit-btn').onclick = (e) => {
                        e.stopPropagation();
                        this.selectedPhoto = photo;
                        document.querySelectorAll('.gallery-photo').forEach(el => el.classList.remove('selected'));
                        div.classList.add('selected');
                        this.folderSelector.style.display = 'flex';
                    };

                    // Botão excluir
                    div.querySelector('.delete-btn').onclick = (e) => {
                        e.stopPropagation();
                        if (confirm(`Excluir foto de ${photo.folder}?`)) {
                            this.deletePhoto(photo.id);
                        }
                    };

                    this.galleryGrid.appendChild(div);
                });
            }

            // ✅ NOVA: MOVER PARA PASTA
            movePhotoToFolder(photo, folder) {
                photo.folder = folder;
                // Atualizar botão ativo
                document.querySelectorAll('.folder-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.folder === folder);
                });
                
                localStorage.setItem('cameraPhotos', JSON.stringify(this.photos));
                this.filterPhotos(this.gallerySearch.value);
                this.folderSelector.style.display = 'none';
                
                // Download opcional
                const link = document.createElement("a");
                link.href = photo.data;
                link.download = `${folder.replace(/[^a-z0-9]/gi, '_')}_${photo.id}.jpg`;
                link.click();
            }

            // ✅ NOVA: EXCLUIR FOTO
            deletePhoto(photoId) {
                this.photos = this.photos.filter(photo => photo.id !== photoId);
                this.selectedPhotos.delete(photoId);
                localStorage.setItem('cameraPhotos', JSON.stringify(this.photos));
                this.filterPhotos(this.gallerySearch.value);
                
                if (this.selectedPhoto && this.selectedPhoto.id === photoId) {
                    this.selectedPhoto = null;
                    this.folderSelector.style.display = 'none';
                }
            }

            handleFocus(e) {
                const rect = this.video.getBoundingClientRect();
                const x = e.clientX - rect.left - 60;
                const y = e.clientY - rect.top - 60;
                
                this.focus.style.left = x + 'px';
                this.focus.style.top = y + 'px';
                this.focus.style.display = "block";
                setTimeout(() => this.focus.style.display = "none", 600);
            }
        }

        window.addEventListener('load', () => new SamsungCamera());
    </script>
</body>
</html>
