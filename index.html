<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Câmera iPhone Clone</title>

<!-- ICONS -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
/>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:black;
    overflow:hidden;
}

/* CELULAR */

.phone{
    width:390px;
    height:820px;
    background:black;
    border-radius:55px;
    overflow:hidden;
    position:relative;

    border:8px solid #1f1f1f;

    box-shadow:
    0 0 0 3px #555,
    0 0 40px rgba(255,255,255,0.08);
}

/* NOTCH */

.notch{
    position:absolute;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    width:170px;
    height:35px;
    background:black;
    border-radius:30px;
    z-index:1000;
}

/* STATUS */

.status-bar{
    width:100%;
    padding:18px 24px;
    position:absolute;
    top:0;
    left:0;

    display:flex;
    justify-content:space-between;
    align-items:center;

    color:white;
    z-index:999;

    font-size:18px;
    font-weight:bold;
}

.status-icons{
    display:flex;
    gap:10px;
}

/* MENU SUPERIOR */

.top-menu{
    width:100%;
    position:absolute;
    top:70px;
    left:0;

    display:flex;
    justify-content:space-around;
    align-items:center;

    color:white;
    z-index:999;

    background:rgba(0,0,0,0.35);

    backdrop-filter:blur(10px);

    padding:15px 0;

    font-size:28px;
}

/* CAMERA */

.camera-area{
    width:100%;
    height:100%;
    position:relative;
    overflow:hidden;
}

/* VIDEO */

video{
    width:100%;
    height:100%;
    object-fit:cover;
    background:black;
}

/* FLASH */

.flash{
    position:absolute;
    inset:0;
    background:white;
    opacity:0;
    pointer-events:none;
    transition:0.15s;
}

/* FOCUS */

.focus{
    width:90px;
    height:90px;

    border:3px solid #ffd000;

    border-radius:10px;

    position:absolute;

    display:none;

    pointer-events:none;

    animation:focusAnim .8s ease;
}

@keyframes focusAnim{

    0%{
        transform:scale(1.4);
        opacity:0;
    }

    50%{
        opacity:1;
    }

    100%{
        transform:scale(1);
        opacity:0;
    }

}

/* BOTTOM */

.bottom{
    width:100%;
    position:absolute;
    bottom:0;
    left:0;

    padding:20px;

    background:linear-gradient(
    to top,
    rgba(0,0,0,0.96),
    rgba(0,0,0,0.4),
    transparent
    );

    z-index:999;
}

/* MODES */

.modes{
    width:100%;

    display:flex;
    justify-content:center;
    gap:25px;

    margin-bottom:20px;
}

.modes button{

    border:none;
    background:none;

    color:white;

    font-size:20px;
    font-weight:bold;

    opacity:0.6;

    cursor:pointer;
}

.modes .active{
    opacity:1;
}

/* CONTROLS */

.controls{
    width:100%;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

/* GALLERY */

.gallery{
    width:60px;
    height:60px;

    border-radius:15px;

    overflow:hidden;
}

.gallery img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* CAPTURE */

.capture{
    width:95px;
    height:95px;

    border-radius:50%;

    border:6px solid white;

    background:#e9e9e9;

    cursor:pointer;

    transition:0.2s;
}

.capture:active{
    transform:scale(0.9);
}

/* MORE */

.more{
    width:60px;
    height:60px;

    border:none;
    background:none;

    color:white;

    font-size:32px;

    cursor:pointer;
}

/* RESPONSIVO */

@media(max-width:450px){

    .phone{
        width:100%;
        height:100vh;
        border:none;
        border-radius:0;
    }

}

</style>
</head>

<body>

<div class="phone">

    <!-- NOTCH -->
    <div class="notch"></div>

    <!-- STATUS -->
    <div class="status-bar">

        <span id="clock">06:07</span>

        <div class="status-icons">
            <i class="fa-solid fa-signal"></i>
            <i class="fa-solid fa-wifi"></i>
            <i class="fa-solid fa-battery-full"></i>
        </div>

    </div>

    <!-- MENU -->
    <div class="top-menu">

        <i class="fa-solid fa-glasses"></i>
        <i class="fa-solid fa-robot"></i>
        <i class="fa-regular fa-book-open"></i>
        <i class="fa-regular fa-folder"></i>
        <i class="fa-solid fa-gear"></i>

    </div>

    <!-- CAMERA -->
    <div class="camera-area">

        <video id="video" autoplay playsinline></video>

        <div class="flash" id="flash"></div>

        <div class="focus" id="focus"></div>

    </div>

    <!-- BOTTOM -->
    <div class="bottom">

        <!-- MODES -->
        <div class="modes">

            <button>Retrato</button>

            <button class="active">Foto</button>

            <button>Vídeo</button>

        </div>

        <!-- CONTROLS -->
        <div class="controls">

            <div class="gallery">

                <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?q=80&w=400" alt="">

            </div>

            <button class="capture" id="capture"></button>

            <button class="more">
                <i class="fa-solid fa-ellipsis"></i>
            </button>

        </div>

    </div>

    <!-- CANVAS -->
    <canvas id="canvas" style="display:none;"></canvas>

</div>

<script>

/* ELEMENTOS */

const video = document.getElementById("video");
const capture = document.getElementById("capture");
const canvas = document.getElementById("canvas");
const flash = document.getElementById("flash");
const focus = document.getElementById("focus");
const clock = document.getElementById("clock");

/* RELOGIO */

function updateClock(){

    const now = new Date();

    let h = now.getHours().toString().padStart(2,"0");
    let m = now.getMinutes().toString().padStart(2,"0");

    clock.innerHTML = `${h}:${m}`;

}

setInterval(updateClock,1000);

updateClock();

/* CAMERA */

async function startCamera(){

    try{

        const stream = await navigator.mediaDevices.getUserMedia({

            video:{
                facingMode:"user"
            },

            audio:false

        });

        video.srcObject = stream;

    }catch(error){

        alert("Erro ao acessar câmera");

        console.error(error);

    }

}

startCamera();

/* FOTO */

capture.addEventListener("click",()=>{

    /* FLASH */

    flash.style.opacity = "1";

    setTimeout(()=>{

        flash.style.opacity = "0";

    },120);

    /* SOM */

    const audio = new Audio(
    "https://actions.google.com/sounds/v1/camera/camera_shutter_click_01.mp3"
    );

    audio.play();

    /* FOTO */

    const ctx = canvas.getContext("2d");

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );

    const image = canvas.toDataURL("image/png");

    const link = document.createElement("a");

    link.href = image;

    link.download = "foto.png";

    link.click();

});

/* FOCO */

video.addEventListener("click",(e)=>{

    const rect = video.getBoundingClientRect();

    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    focus.style.left = `${x - 45}px`;
    focus.style.top = `${y - 45}px`;

    focus.style.display = "block";

    setTimeout(()=>{

        focus.style.display = "none";

    },700);

});

</script>

</body>
</html>
