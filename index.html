<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <title>iPhone Camera Pro - S24 FE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
    
    <style>
        :root {
            --primary-color: #ffd000;
            --accent-color: #00ff88;
            --bg-primary: #000;
            --text-primary: #fff;
            --border-color: rgba(255,255,255,0.12);
            --blur-bg: rgba(0,0,0,0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            width: 100%;
            height: 100vh;
            background: var(--bg-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: manipulation;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        /* PHONE - Perfeito pro S24 FE (6.7" 1080x2340) */
        .phone {
            width: 100%;
            height: 100vh;
            max-width: 400px;
            max-height: 900px;
            background: linear-gradient(145deg, #1a1a1a, #0d0d0d);
            border-radius: 32px;
            overflow: hidden;
            position: relative;
            margin: 8px;
            box-shadow: 
                0 20px 60px -12px rgba(0,0,0,0.8),
                inset 0 1px 0 rgba(255,255,255,0.1);
        }

        /* SEM NOTCH - Adaptado pro punch hole do S24 FE */
        .status-bar {
            position: absolute;
            top: env(safe-area-inset-top);
            left: 0;
            right: 0;
            padding: 12px 24px 8px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            color: var(--text-primary);
            z-index: 999;
            font-size: 14px;
            font-weight: 500;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(20px);
            /* ESPAÇO PRO PUNCH HOLE DO S24 FE */
            padding-top: max(20px, env(safe-area-inset-top));
        }

        .status-left {
            display: flex;
            gap: 8px;
            align-items: center;
            font-size: 15px;
        }

        .status-icons {
            display: flex;
            gap: 4px;
            font-size: 12px;
        }

        /* TOP MENU - Mais compacto */
        .top-menu {
            position: absolute;
            top: 70px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            padding: 12px 0;
            color: var(--text-primary);
            z-index: 999;
            background: var(--blur-bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
        }

        .top-menu i {
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            padding: 8px;
            border-radius: 12px;
            opacity: 0.8;
            font-size: 26px;
        }

        .top-menu i:hover, .top-menu i:active {
            opacity: 1;
            transform: scale(1.15);
            background: rgba(255,255,255,0.1);
        }

        /* CAMERA AREA - FULLSCREEN */
        .camera-area {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
            transform: scaleX(1);
            will-change: transform;
        }

        /* CORREÇÃO CAMERA FRONTAL - NÃO INVERTIDA */
        .camera-user video {
            transform: scaleX(-1) !important;
        }

        .flash {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, #fff 0%, #ffd000 30%, transparent 70%);
            opacity: 0;
            pointer-events: none;
            transition: all 0.2s ease-out;
        }

        /* GRID 3x3 */
        .grid {
            position: absolute;
            inset: 0;
            pointer-events: none;
            display: none;
            opacity: 0.4;
        }

        .grid span {
            position: absolute;
            background: var(--accent-color);
        }

        .grid span:nth-child(1), .grid span:nth-child(2) { width: 1px; height: 100%; }
        .grid span:nth-child(3), .grid span:nth-child(4) { height: 1px; width: 100%; }
        .grid span:nth-child(1) { left: 33.33%; }
        .grid span:nth-child(2) { left: 66.66%; }
        .grid span:nth-child(3) { top: 33.33%; }
        .grid span:nth-child(4) { top: 66.66%; }

        .focus {
            width: 100px;
            height: 100px;
            border: 2px solid var(--primary-color);
            border-radius: 20px;
            position: absolute;
            display: none;
            pointer-events: none;
            box-shadow: 
                0 0 0 3px rgba(255,208,0,0.3),
                inset 0 0 0 2px rgba(255,255,255,0.2);
            animation: focusPulse 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        @keyframes focusPulse {
            0% { transform: scale(1.8); opacity: 0; }
            20% { opacity: 1; }
            70% { opacity: 1; transform: scale(1.05); }
            100% { transform: scale(1); opacity: 0; }
        }

        /* ZOOM - Posição perfeita pro S24 FE */
        .zoom {
            position: absolute;
            bottom: 260px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 999;
            padding: 12px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(25px);
            border-radius: 28px;
            border: 1px solid var(--border-color);
        }

        .zoom button {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            border: none;
            background: rgba(0,0,0,0.6);
            color: var(--text-primary);
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            border: 1px solid var(--border-color);
            transition: all 0.25s ease;
        }

        .zoom button.active, .zoom button:hover {
            background: var(--text-primary);
            color: var(--bg-primary);
            transform: scale(1.05);
        }

        /* BOTTOM - Otimizado */
        .bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 32px 24px 24px;
            background: linear-gradient(to top, 
                rgba(0,0,0,0.98) 0%, 
                rgba(0,0,0,0.7) 40%, 
                transparent 100%);
            z-index: 999;
        }

        .modes {
            display: flex;
            justify-content: center;
            gap: 28px;
            margin-bottom: 24px;
        }

        .modes button {
            border: none;
            background: none;
            color: var(--text-primary);
            font-size: 17px;
            font-weight: 600;
            opacity: 0.6;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        .modes button.active {
            opacity: 1;
            background: rgba(255,255,255,0.15);
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 24px;
        }

        .gallery {
            width: 68px;
            height: 68px;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.3);
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }

        .gallery:hover {
            transform: scale(1.08);
            border-color: var(--primary-color);
        }

        .gallery img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .capture {
            width: 82px;
            height: 82px;
            border-radius: 50%;
            border: 7px solid rgba(255,255,255,0.85);
            background: radial-gradient(circle, #fff 0%, #f5f5f5 70%, #e0e0e0 100%);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 
                0 10px 30px rgba(0,0,0,0.4),
                inset 0 3px 0 rgba(255,255,255,0.8);
            position: relative;
        }

        .capture::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: radial-gradient(circle, #f8f8f8 0%, #d8d8d8 100%);
            box-shadow: inset 0 2px 0 rgba(255,255,255,0.7);
        }

        .capture:active {
            transform: scale(0.92);
            box-shadow: 
                0 6px 20px rgba(0,0,0,0.5),
                inset 0 2px 0 rgba(255,255,255,0.8),
                0 0 0 8px rgba(255,208,0,0.3);
        }

        .side-buttons {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .side-buttons button {
            width: 60px;
            height: 60px;
            border: none;
            border-radius: 18px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(20px);
            color: var(--text-primary);
            font-size: 18px;
            cursor: pointer;
            border: 1px solid var(--border-color);
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .side-buttons button:hover {
            background: rgba(255,255,255,0.2);
            transform: translateY(-2px);
        }

        /* PERFECT RESPONSIVE S24 FE */
        @media (max-width: 430px) {
            .phone {
                margin: 0;
                border-radius: 24px;
                height: 100vh;
                width: 100vw;
            }
            
            .status-bar {
                padding: 16px 20px 12px;
                padding-top: max(28px, env(safe-area-inset-top));
            }
            
            .zoom {
                bottom: 240px;
                gap: 8px;
            }
            
            .zoom button {
                width: 52px;
                height: 52px;
                font-size: 14px;
            }
        }

        /* PWA & SAFE AREAS */
        @supports (padding: max(0px, env(safe-area-inset-top))) {
            body {
                padding-top: env(safe-area-inset-top);
                padding-left: env(safe-area-inset-left);
                padding-right: env(safe-area-inset-right);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <div class="phone">
        <!-- STATUS BAR (SEM BARRA PRETA ESTRANHA) -->
        <div class="status-bar">
            <div class="status-left">
                <span id="clock">09:09</span>
                <span style="opacity: 0.7; font-size: 12px;">●</span>
            </div>
            <div class="status-icons">
                <i class="fa-solid fa-signal-bars-good" style="font-size: 11px;"></i>
                <i class="fa-solid fa-wifi" style="font-size: 11px;"></i>
                <i class="fa-solid fa-battery-three-quarters" style="font-size: 13px;"></i>
            </div>
        </div>

        <!-- TOP MENU -->
        <div class="top-menu">
            <i class="fa-solid fa-bolt" title="Flash"></i>
            <i class="fa-solid fa-wand-magic-sparkles" title="Live Photo"></i>
            <i class="fa-solid fa-layer-group" title="Portrait"></i>
            <i class="fa-solid fa-moon" title="Night mode"></i>
            <i class="fa-solid fa-gear" title="Settings"></i>
        </div>

        <!-- CAMERA -->
        <div class="camera-area">
            <video id="video" autoplay playsinline muted></video>
            <div class="flash" id="flash"></div>
            <div class="grid" id="grid">
                <span></span><span></span><span></span><span></span>
            </div>
            <div class="focus" id="focus"></div>
        </div>

        <!-- ZOOM -->
        <div class="zoom">
            <button data-zoom="0.5">0.5x</button>
            <button class="active" data-zoom="1">1x</button>
            <button data-zoom="2">2x</button>
        </div>

        <!-- BOTTOM -->
        <div class="bottom">
            <div class="modes">
                <button data-mode="portrait">Retrato</button>
                <button class="active" data-mode="photo">Foto</button>
                <button data-mode="video">Vídeo</button>
            </div>
            
            <div class="controls">
                <div class="gallery" id="gallery">
                    <img id="galleryImg" src="https://images.unsplash.com/photo-1517841905240-472988babdf9?q=80&w=400" alt="Última foto">
                </div>
                
                <button class="capture" id="capture" title="Tirar foto"></button>
                
                <div class="side-buttons">
                    <button id="switchCamera" title="Trocar câmera">
                        <i class="fa-solid fa-rotate"></i>
                    </button>
                    <button id="toggleGrid" title="Grid">
                        <i class="fa-solid fa-border-all"></i>
                    </button>
                </div>
            </div>
        </div>

        <canvas id="canvas" style="display: none;"></canvas>
    </div>

    <script>
        class S24FECamera {
            constructor() {
                this.video = document.getElementById("video");
                this.capture = document.getElementById("capture");
                this.canvas = document.getElementById("canvas");
                this.flash = document.getElementById("flash");
                this.focus = document.getElementById("focus");
                this.clock = document.getElementById("clock");
                this.galleryImg = document.getElementById("galleryImg");
                
                this.currentCamera = "environment";
                this.currentStream = null;
                this.currentZoom = 1;
                this.gridEnabled = false;
                
                this.init();
            }

            init() {
                this.updateClock();
                setInterval(() => this.updateClock(), 1000);
                this.bindEvents();
                this.startCamera();
            }

            async startCamera() {
                try {
                    if (this.currentStream) {
                        this.currentStream.getTracks().forEach(track => track.stop());
                    }

                    const constraints = {
                        video: {
                            facingMode: { exact: this.currentCamera },
                            width: { ideal: 1920 },
                            height: { ideal: 1080 }
                        }
                    };

                    this.currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                    this.video.srcObject = this.currentStream;
                    
                    // CORREÇÃO CAMERA FRONTAL
                    this.video.classList.toggle('camera-user', this.currentCamera === 'user');
                    await this.video.play();
                    
                } catch (error) {
                    console.error("Erro câmera:", error);
                    alert("Ative permissões da câmera!");
                }
            }

            bindEvents() {
                // Switch camera
                document.getElementById("switchCamera").onclick = () => {
                    this.currentCamera = this.currentCamera === "user" ? "environment" : "user";
                    this.startCamera();
                };

                // Capture
                this.capture.onclick = () => this.capturePhoto();

                // Focus
                this.video.onclick = (e) => this.handleFocus(e);

                // Grid
                document.getElementById("toggleGrid").onclick = () => {
                    this.gridEnabled = !this.gridEnabled;
                    document.getElementById("grid").style.display = this.gridEnabled ? "block" : "none";
                };

                // Zoom
                document.querySelectorAll('.zoom button').forEach(btn => {
                    btn.onclick = (e) => {
                        document.querySelector('.zoom .active')?.classList.remove('active');
                        e.target.classList.add('active');
                        this.currentZoom = parseFloat(e.target.dataset.zoom);
                    };
                });

                // Modes
                document.querySelectorAll('.modes button').forEach(btn => {
                    btn.onclick = (e) => {
                        document.querySelector('.modes .active')?.classList.remove('active');
                        e.target.classList.add('active');
                    };
                });
            }

            updateClock() {
                const now = new Date();
                const time = now.toLocaleTimeString('pt-BR', { 
                    hour: '2-digit', 
                    minute: '2-digit',
                    hour12: false 
                });
                this.clock.textContent = time;
            }

            capturePhoto() {
                // Flash
                this.flash.style.opacity = "0.85";
                setTimeout(() => this.flash.style.opacity = "0", 150);

                // Sound
                try {
                    const audio = new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAo');
                    audio.volume = 0.4;
                    audio.play();
                } catch(e) {}

                // Capture
                this.canvas.width = this.video.videoWidth;
                this.canvas.height = this.video.videoHeight;
                const ctx = this.canvas.getContext("2d");
                
                // CORREÇÃO FINAL NA CAPTURA (selfie não invertida)
                ctx.save();
                if (this.currentCamera === 'user') {
                    ctx.scale(-1, 1);
                    ctx.drawImage(this.video, -this.canvas.width, 0);
                } else {
                    ctx.drawImage(this.video, 0, 0);
                }
                ctx.restore();
                
                const imageData = this.canvas.toDataURL("image/jpeg", 0.92);
                this.galleryImg.src = imageData;

                // Download
                const link = document.createElement("a");
                link.href = imageData;
                link.download = `selfie-${Date.now()}.jpg`;
                link.click();
            }

            handleFocus(e) {
                const rect = this.video.getBoundingClientRect();
                const x = (e.clientX - rect.left) / rect.width * 100;
                const y = (e.clientY - rect.top) / rect.height * 100;
                
                this.focus.style.left = `calc(${x}% - 50px)`;
                this.focus.style.top = `calc(${y}% - 50px)`;
                this.focus.style.display = "block";
                setTimeout(() => this.focus.style.display = "none", 800);
            }
        }

        // Start
        window.addEventListener('load', () => {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                new S24FECamera();
            }
        });
    </script>
</body>
</html>
